name: Chrome performance regression

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chrome-performance
  cancel-in-progress: true

jobs:
  actionability:
    name: Actionability P95
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: chrome
        name: Install Chrome for Testing
        uses: browser-actions/setup-chrome@v2

      - name: Run fixed real Chrome benchmark
        run: pnpm perf:chrome
        env:
          TABSTRIDE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Run single-task baseline
        run: pnpm perf:task
        env:
          TABSTRIDE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: actionability-performance
          path: |
            artifacts/actionability-performance.json
            artifacts/single-task-performance.json
          if-no-files-found: warn
