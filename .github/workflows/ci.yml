name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust fmt, clippy, tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Check generated protocol schemas
        run: cargo run -p tabstride-protocol --bin dump-schema --locked -- --check

  frontend:
    name: Frontend lint, typecheck, tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare extension types
        run: pnpm --filter @tabstride/extension exec wxt prepare

      - name: Run lint checks
        run: pnpm lint

      - name: Compile extension TypeScript
        run: pnpm --filter @tabstride/extension compile

      - name: Run extension tests
        run: pnpm ext:test

      - name: Build extension
        run: pnpm ext:build

  node-scripts:
    name: Node script tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run script tests
        run: node --test scripts/*.test.mjs

  chrome-e2e:
    name: Real Chrome E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: chrome
        name: Install Chrome for Testing
        uses: browser-actions/setup-chrome@v2

      - name: Run real Chrome fast-path and hot-path regression suite
        run: pnpm test:chrome
        env:
          TABSTRIDE_CHROME: ${{ steps.chrome.outputs.chrome-path }}

      - name: Run complete single-task performance regression
        run: pnpm perf:task
        env:
          TABSTRIDE_CHROME: ${{ steps.chrome.outputs.chrome-path }}
